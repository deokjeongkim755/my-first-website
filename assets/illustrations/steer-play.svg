<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067" role="img" aria-label="花生角色一手扶着方向舵、望向探索路线的插画">
  <defs>
    <radialGradient id="bg4" cx="42%" cy="42%" r="82%">
      <stop offset="0" stop-color="#1e3a72"/>
      <stop offset="1" stop-color="#0b1733"/>
    </radialGradient>
    <linearGradient id="peanut4" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="1" stop-color="#f0b45a"/>
    </linearGradient>
    <pattern id="dots4" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1067" fill="url(#bg4)"/>
  <rect width="1600" height="1067" fill="url(#dots4)"/>

  <!-- 探索路线 -->
  <g fill="none" stroke-linecap="round">
    <path d="M1120 470c120-72 178-182 158-288-8-52-40-92-88-118"
          stroke="#42d7c4" stroke-width="11" stroke-dasharray="22 26" opacity=".9"/>
  </g>
  <path d="M1184 92l-48 8 26 32z" fill="#42d7c4" stroke="#42d7c4" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#0c1732" stroke-width="6">
    <circle cx="1272" cy="248" r="21" fill="#ffd84d"/>
    <circle cx="1226" cy="392" r="14" fill="#4b92ff"/>
  </g>

  <!-- 方向舵 -->
  <g transform="translate(430 430)">
    <circle r="188" fill="none" stroke="#0c1732" stroke-width="40"/>
    <circle r="188" fill="none" stroke="#ff6846" stroke-width="22"/>
    <g stroke="#0c1732" stroke-width="34" stroke-linecap="round">
      <path d="M0-46V-188"/><path d="M0 46v142"/><path d="M-46 0H-188"/><path d="M46 0h142"/>
    </g>
    <g stroke="#ffd84d" stroke-width="18" stroke-linecap="round">
      <path d="M0-46V-188"/><path d="M0 46v142"/><path d="M-46 0H-188"/><path d="M46 0h142"/>
    </g>
    <circle r="52" fill="#f0b45a" stroke="#0c1732" stroke-width="12"/>
  </g>

  <!-- 花生角色 -->
  <g transform="translate(700 398) scale(1.6)">
    <g fill="none" stroke-linecap="round">
      <path d="M152 128c20 10 30 30 26 50" stroke="#0c1732" stroke-width="15"/>
      <path d="M152 128c20 10 30 30 26 50" stroke="#f0b45a" stroke-width="8"/>
    </g>
    <circle cx="180" cy="186" r="13" fill="#f0b45a" stroke="#0c1732" stroke-width="6"/>

    <path d="M100 14C136 14 158 38 158 68c0 20-12 32-20 42 8 10 20 22 20 42 0 30-22 54-58 54s-58-24-58-54c0-20 12-32 20-42-8-10-20-22-20-42 0-30 22-54 58-54z"
          fill="url(#peanut4)" stroke="#0c1732" stroke-width="7" stroke-linejoin="round"/>

    <path d="M64 156c14-8 58-8 72 0l-2 28c-12 9-22 9-30 0l-4-9-4 9c-8 9-18 9-30 0z"
          fill="#ff6846" stroke="#0c1732" stroke-width="6" stroke-linejoin="round"/>
    <rect x="60" y="196" width="30" height="26" rx="9" fill="#ffd84d" stroke="#0c1732" stroke-width="6"/>
    <rect x="110" y="196" width="30" height="26" rx="9" fill="#ffd84d" stroke="#0c1732" stroke-width="6"/>

    <circle cx="82" cy="74" r="9" fill="#0c1732"/>
    <circle cx="118" cy="74" r="9" fill="#0c1732"/>
    <circle cx="85" cy="71" r="3" fill="#fff"/>
    <circle cx="121" cy="71" r="3" fill="#fff"/>
    <ellipse cx="62" cy="92" rx="9" ry="5.5" fill="#ff6846" opacity=".6"/>
    <ellipse cx="138" cy="92" rx="9" ry="5.5" fill="#ff6846" opacity=".6"/>
    <path d="M86 94c8 11 22 11 30 0" fill="none" stroke="#0c1732" stroke-width="6" stroke-linecap="round"/>

    <path d="M140 30c10-16 26-24 40-22" fill="none" stroke="#0c1732" stroke-width="6" stroke-linecap="round"/>
    <circle cx="184" cy="7" r="9" fill="#4bd7c4" stroke="#0c1732" stroke-width="5"/>
  </g>

  <!-- 扶着舵的手 -->
  <g fill="none" stroke-linecap="round">
    <path d="M782 606c-52-4-92-46-116-108" stroke="#0c1732" stroke-width="26"/>
    <path d="M782 606c-52-4-92-46-116-108" stroke="#f0b45a" stroke-width="14"/>
  </g>
  <circle cx="666" cy="498" r="20" fill="#f0b45a" stroke="#0c1732" stroke-width="8"/>
</svg>
