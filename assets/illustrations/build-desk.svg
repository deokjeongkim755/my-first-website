<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-label="花生角色在搭好的彩色积木塔旁边欢呼的插画">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="76%">
      <stop offset="0" stop-color="#1c3568"/>
      <stop offset="1" stop-color="#0b1733"/>
    </radialGradient>
    <linearGradient id="peanut2" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="1" stop-color="#f0b45a"/>
    </linearGradient>
    <pattern id="dots2" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="900" height="1600" fill="url(#bg2)"/>
  <rect width="900" height="1600" fill="url(#dots2)"/>
  <circle cx="700" cy="520" r="210" fill="#42d7c4" opacity=".1"/>
  <circle cx="170" cy="900" r="190" fill="#ff6846" opacity=".1"/>

  <!-- 积木塔 -->
  <g stroke="#0c1732" stroke-width="8" stroke-linejoin="round">
    <rect x="560" y="1118" width="240" height="108" rx="16" fill="#4b92ff"/>
    <rect x="560" y="1010" width="240" height="108" rx="16" fill="#ffd84d"/>
    <rect x="560" y="902" width="240" height="108" rx="16" fill="#916cf1"/>
    <rect x="560" y="794" width="240" height="108" rx="16" fill="#42d7c4"/>
    <rect x="560" y="686" width="240" height="108" rx="16" fill="#ff6846"/>
    <rect x="560" y="578" width="240" height="108" rx="16" fill="#4b92ff"/>
  </g>
  <g fill="#0c1732" opacity=".4">
    <rect x="584" y="1146" width="96" height="12" rx="6"/>
    <rect x="680" y="1038" width="96" height="12" rx="6"/>
    <rect x="584" y="930" width="96" height="12" rx="6"/>
    <rect x="680" y="822" width="96" height="12" rx="6"/>
    <rect x="584" y="714" width="96" height="12" rx="6"/>
    <rect x="680" y="606" width="96" height="12" rx="6"/>
  </g>

  <!-- 塔顶小旗 -->
  <path d="M684 578v-104" stroke="#0c1732" stroke-width="10" stroke-linecap="round"/>
  <path d="M684 480h92l-24 28 24 28h-92z" fill="#ffd84d" stroke="#0c1732" stroke-width="8" stroke-linejoin="round"/>

  <!-- 散落积木 -->
  <g stroke="#0c1732" stroke-width="7" stroke-linejoin="round">
    <rect x="66" y="1174" width="120" height="58" rx="12" fill="#42d7c4"/>
    <rect x="164" y="1116" width="96" height="58" rx="12" fill="#ffd84d" transform="rotate(-9 212 1145)"/>
  </g>

  <!-- 花生角色 -->
  <g transform="translate(150 886) scale(1.55)">
    <ellipse cx="100" cy="220" rx="72" ry="11" fill="#050c1c" opacity=".4"/>

    <g fill="none" stroke-linecap="round">
      <path d="M50 122c-18-8-28-26-30-46" stroke="#0c1732" stroke-width="15"/>
      <path d="M50 122c-18-8-28-26-30-46" stroke="#f0b45a" stroke-width="8"/>
      <path d="M150 122c18-8 28-26 30-46" stroke="#0c1732" stroke-width="15"/>
      <path d="M150 122c18-8 28-26 30-46" stroke="#f0b45a" stroke-width="8"/>
    </g>
    <circle cx="18" cy="66" r="13" fill="#f0b45a" stroke="#0c1732" stroke-width="6"/>
    <circle cx="182" cy="66" r="13" fill="#f0b45a" stroke="#0c1732" stroke-width="6"/>

    <path d="M100 14C136 14 158 38 158 68c0 20-12 32-20 42 8 10 20 22 20 42 0 30-22 54-58 54s-58-24-58-54c0-20 12-32 20-42-8-10-20-22-20-42 0-30 22-54 58-54z"
          fill="url(#peanut2)" stroke="#0c1732" stroke-width="7" stroke-linejoin="round"/>

    <path d="M64 156c14-8 58-8 72 0l-2 28c-12 9-22 9-30 0l-4-9-4 9c-8 9-18 9-30 0z"
          fill="#ff6846" stroke="#0c1732" stroke-width="6" stroke-linejoin="round"/>
    <rect x="60" y="196" width="30" height="26" rx="9" fill="#ffd84d" stroke="#0c1732" stroke-width="6"/>
    <rect x="110" y="196" width="30" height="26" rx="9" fill="#ffd84d" stroke="#0c1732" stroke-width="6"/>

    <circle cx="82" cy="74" r="9" fill="#0c1732"/>
    <circle cx="118" cy="74" r="9" fill="#0c1732"/>
    <circle cx="85" cy="71" r="3" fill="#fff"/>
    <circle cx="121" cy="71" r="3" fill="#fff"/>
    <ellipse cx="62" cy="92" rx="9" ry="5.5" fill="#ff6846" opacity=".6"/>
    <ellipse cx="138" cy="92" rx="9" ry="5.5" fill="#ff6846" opacity=".6"/>
    <path d="M84 92c8 14 26 14 34 0z" fill="#ff6846" stroke="#0c1732" stroke-width="6" stroke-linejoin="round"/>

    <path d="M140 30c10-16 26-24 40-22" fill="none" stroke="#0c1732" stroke-width="6" stroke-linecap="round"/>
    <circle cx="184" cy="7" r="9" fill="#4bd7c4" stroke="#0c1732" stroke-width="5"/>
  </g>

  <!-- 庆祝火花 -->
  <g stroke="#ffd84d" stroke-width="8" stroke-linecap="round">
    <path d="M452 760v-30"/><path d="M410 780l-20-20"/><path d="M494 780l20-20"/>
  </g>

  <!-- 地面 -->
  <path d="M0 1232h900v368H0z" fill="#0a1429"/>
  <path d="M0 1232h900" stroke="#4bd7c4" stroke-width="5" opacity=".4"/>
</svg>
