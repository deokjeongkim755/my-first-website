<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1467" viewBox="0 0 1100 1467" role="img" aria-label="花生角色思考中的插画">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#1e3a72"/>
      <stop offset="1" stop-color="#0b1733"/>
    </radialGradient>
    <linearGradient id="peanut" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="1" stop-color="#f0b45a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.74" stop-color="#0b1733" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1733" stop-opacity=".62"/>
    </linearGradient>
    <pattern id="dots" width="58" height="58" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1100" height="1467" fill="url(#bg)"/>
  <rect width="1100" height="1467" fill="url(#dots)"/>

  <!-- 漂浮积木 -->
  <g stroke="#0c1732" stroke-width="6" stroke-linejoin="round">
    <g transform="rotate(-8 900 1080)">
      <rect x="836" y="1052" width="128" height="48" rx="12" fill="#4b92ff"/>
    </g>
    <g transform="rotate(7 250 1120)">
      <rect x="188" y="1092" width="112" height="44" rx="12" fill="#ffd84d"/>
    </g>
  </g>

  <!-- 思考气泡 -->
  <g>
    <circle cx="512" cy="452" r="14" fill="#fff8e6" stroke="#0c1732" stroke-width="6"/>
    <circle cx="462" cy="418" r="19" fill="#fff8e6" stroke="#0c1732" stroke-width="6"/>
    <rect x="140" y="150" width="330" height="248" rx="40" fill="#fff8e6" stroke="#0c1732" stroke-width="8"/>
    <g transform="translate(305 274)">
      <circle r="60" fill="#ffd84d" stroke="#0c1732" stroke-width="8"/>
      <path d="M-13-34h27v34h-27z" fill="#ff6846" stroke="#0c1732" stroke-width="7"/>
      <circle cy="4" r="24" fill="#ff6846" stroke="#0c1732" stroke-width="7"/>
      <g stroke="#0c1732" stroke-width="7" stroke-linecap="round">
        <path d="M-43-46l-14-13"/><path d="M43-46l14-13"/><path d="M0-58v-18"/>
      </g>
    </g>
  </g>

  <!-- 花生角色 -->
  <g transform="translate(272 396) scale(2.85)">
    <ellipse cx="100" cy="220" rx="72" ry="11" fill="#050c1c" opacity=".4"/>

    <!-- 左臂 -->
    <g fill="none" stroke-linecap="round">
      <path d="M50 132c-20 14-26 36-18 54" stroke="#0c1732" stroke-width="15"/>
      <path d="M50 132c-20 14-26 36-18 54" stroke="#f0b45a" stroke-width="8"/>
    </g>
    <circle cx="34" cy="190" r="12" fill="#f0b45a" stroke="#0c1732" stroke-width="5"/>

    <!-- 身体 -->
    <path d="M100 14C136 14 158 38 158 68c0 20-12 32-20 42 8 10 20 22 20 42 0 30-22 54-58 54s-58-24-58-54c0-20 12-32 20-42-8-10-20-22-20-42 0-30 22-54 58-54z"
          fill="url(#peanut)" stroke="#0c1732" stroke-width="7" stroke-linejoin="round"/>

    <!-- 短裤 -->
    <path d="M64 156c14-8 58-8 72 0l-2 28c-12 9-22 9-30 0l-4-9-4 9c-8 9-18 9-30 0z"
          fill="#ff6846" stroke="#0c1732" stroke-width="6" stroke-linejoin="round"/>

    <!-- 脚 -->
    <rect x="60" y="196" width="30" height="26" rx="9" fill="#ffd84d" stroke="#0c1732" stroke-width="6"/>
    <rect x="110" y="196" width="30" height="26" rx="9" fill="#ffd84d" stroke="#0c1732" stroke-width="6"/>

    <!-- 右臂托腮 -->
    <g fill="none" stroke-linecap="round">
      <path d="M152 126c26 4 42 20 38 40" stroke="#0c1732" stroke-width="15"/>
      <path d="M152 126c26 4 42 20 38 40" stroke="#f0b45a" stroke-width="8"/>
    </g>
    <circle cx="190" cy="168" r="13" fill="#f0b45a" stroke="#0c1732" stroke-width="6"/>

    <!-- 表情 -->
    <circle cx="82" cy="74" r="9" fill="#0c1732"/>
    <circle cx="118" cy="74" r="9" fill="#0c1732"/>
    <circle cx="85" cy="71" r="3" fill="#fff"/>
    <circle cx="121" cy="71" r="3" fill="#fff"/>
    <ellipse cx="62" cy="92" rx="9" ry="5.5" fill="#ff6846" opacity=".6"/>
    <ellipse cx="138" cy="92" rx="9" ry="5.5" fill="#ff6846" opacity=".6"/>
    <path d="M88 96c5 9 19 9 24 0" fill="none" stroke="#0c1732" stroke-width="6" stroke-linecap="round"/>

    <!-- 小芽 -->
    <path d="M140 30c10-16 26-24 40-22" fill="none" stroke="#0c1732" stroke-width="6" stroke-linecap="round"/>
    <circle cx="184" cy="7" r="9" fill="#4bd7c4" stroke="#0c1732" stroke-width="5"/>
  </g>

  <rect width="1100" height="1467" fill="url(#fade)"/>
</svg>
