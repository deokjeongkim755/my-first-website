          fill="url(#peanut3)" stroke="#0c1732" stroke-width="14" stroke-linejoin="round"/>

    <!-- 眼睛 -->
    <circle cx="-104" cy="-104" r="42" fill="#0c1732"/>
    <circle cx="104" cy="-104" r="42" fill="#0c1732"/>
    <circle cx="-88" cy="-120" r="13" fill="#ffffff"/>
    <circle cx="120" cy="-120" r="13" fill="#ffffff"/>

    <!-- 腮红 -->
