    </radialGradient>
    <linearGradient id="peanut3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="1" stop-color="#efae52"/>
    </linearGradient>
    <pattern id="dots3" width="50" height="50" patternUnits="userSpaceOnUse">
